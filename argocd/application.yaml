apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ai-gitops-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/anandu4879/ai-gitops-platform.git
    targetRevision: HEAD
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true